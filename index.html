<section id="ch-puzzle" style="scroll-margin-top:72px; background:#0E2438; padding:96px 0">
<div style="max-width:1200px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:40px">
<div style="display:flex; flex-direction:column; gap:14px; max-width:880px">
<div class="ui" style="font-size:15px; letter-spacing:0.12em; text-transform:uppercase; font-weight:800; color:#FF4F8B">1 · The puzzle</div>
<h2 class="ui" style="margin:0; font-size:clamp(38px, 5.8vw, 76px); line-height:1; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF">Why would anyone queue for years for plastic surgery?</h2>
<p style="margin:0; font-size:21px; color:#D5DCE4">Ester is twenty-six and lives in Vidigal, a <em>favela</em> on the rocks above Leblon. She cooks lunch and dinner five days a week for Dr Eduardo, a young plastic surgeon. One evening she shyly asks him for a word: “<em>Quero botar silicone, doutor</em>” (I want to put in silicone, doctor). She has already chosen the model, size and shape of her implants (pp. 1–2). She isn't wealthy and she isn't a celebrity. So why does she want it, and why do so many women like her?</p>
</div>
<blockquote style="margin:0; padding:36px; background:#FF4F8B; color:#1A0A12; border-radius:24px; display:flex; flex-direction:column; gap:14px">
<p class="ui" style="margin:0; font-size:clamp(20px, 2.5vw, 28px); line-height:1.35; font-weight:700">“How in these circumstances can we understand a ‘right to beauty’? Why are patients such as Ester embracing a medical technology formerly the preserve of Tatiana and other members of the nation's elite? Why did a security guard at one of Rio's largest prisons seek out an operation termed ‘correction of the Negroid nose’ in a land often celebrated for its racial democracy?”</p>
<p class="ui" style="margin:0; font-size:15px; font-weight:700">Edmonds' puzzles, Introduction (p. 16)</p>
</blockquote>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:20px">
<div style="background:#16324D; border-radius:20px; padding:28px; display:flex; flex-direction:column; gap:10px">
<div class="ui" style="font-weight:800; font-size:24px; color:#FFC531">Where and who</div>
<p style="margin:0">Rio de Janeiro, in two long periods of fieldwork (1998–99 and 2000–01) and shorter visits up to 2009 (p. 257, note 2). He began among Ipanema socialites, then moved into Santa Casa and public hospitals, Globo's <em>telenovela</em> studios, ad agencies, NGOs, <em>favelas</em> and the homes of maids and their employers (pp. 7–23).</p>
</div>
<div style="background:#16324D; border-radius:20px; padding:28px; display:flex; flex-direction:column; gap:10px">
<div class="ui" style="font-weight:800; font-size:24px; color:#22C3B5">The surprise</div>
<p style="margin:0">“Rising demand, however, cannot be explained simply as a product of prosperity.” Much richer European countries have per-capita rates about a fifth of Brazil's, and surgery boomed while income concentration rose in the 1980s and 1990s (p. 16).</p>
</div>
<div style="background:#16324D; border-radius:20px; padding:28px; display:flex; flex-direction:column; gap:10px">
<div class="ui" style="font-weight:800; font-size:24px; color:#FF7AA8">The big idea</div>
<p style="margin:0">Beauty is “a social domain that has its own internal logic that cannot be reduced to an operation of other forms of power” (p. 20). It is a “double negative”: “an unfair hierarchy that can disturb other unfair hierarchies” (p. 250).</p>
</div>
</div>
</div>
</section>

<section id="ch-rio" style="scroll-margin-top:72px; background:#0B3A4F; padding:96px 0">
<div style="max-width:1200px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:40px">

<div class="ui" style="font-size:15px; letter-spacing:0.12em; text-transform:uppercase; font-weight:800; color:#3DD6C8">3 · Urban life</div>
<h2 class="ui" style="margin:0; font-size:clamp(38px, 5.8vw, 76px); line-height:1; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF">What is Rio really like?</h2>
<p style="margin:0; font-size:21px; color:#D2E6EA">Edmonds introduces the “City of Beauty and Chaos” with a portrait of its beaches, divided into “microhabitats” and “tribal divisions”, with rich and poor side by side (pp. 4–7). <em>Favela</em> residents call life at street level the <strong>“asphalt”</strong> (p. 2). Ester gets a one-real mototaxi ride from the asphalt to the top of Vidigal, past police jeeps, bars, beauty parlours and eighteen evangelical churches (p. 2). Rio has around 700 <em>favelas</em> (p. 7).</p>
</div>
<div style="display:flex; flex-wrap:wrap; gap:28px; align-items:flex-start">
<div style="flex:1 1 420px; min-width:0; display:flex; flex-direction:column; gap:12px">

<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap:16px">
<div style="background:#FFC531; color:#1A1300; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">1 in 5</div><div class="ui" style="font-size:16px; font-weight:600">Cariocas lived in a <em>favela</em> at the 2010 census (about 22%)</div></div>
<div style="background:#FF4F8B; color:#1A0A12; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">72,021</div><div class="ui" style="font-size:16px; font-weight:600">people live in Rocinha, Brazil's largest <em>favela</em> (2022 census)</div></div>
<div style="background:#3DD6C8; color:#04201D; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">16.4m</div><div class="ui" style="font-size:16px; font-weight:600">Brazilians live in <em>favelas</em> nationally, 8.1% of the population (2022)</div></div>
<div style="background:#B79BFF; color:#160A33; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">73%</div><div class="ui" style="font-size:16px; font-weight:600">of <em>favela</em> residents are <em>pardo</em> or <em>preto</em>, against 55.5% of all Brazilians (2022)</div></div>
</div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap:20px">
<div style="background:#0E4D63; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px; color:#FFC531">Maids and their employers</div><p style="margin:0; font-size:17px">Apartments have a separate service zone with its own entrance, where domestic workers do laundry, eat and sometimes sleep. Since a 1996 law, maids may ride the “noble” elevator, but new forms of mixing “can simply lead to moments of awkwardness” (p. 45). The 2000 census counted 5 million maids (p. 200).</p></div>
<div style="background:#0E4D63; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px; color:#FF7AA8">A city of walls</div><p style="margin:0; font-size:17px">After democracy returned, many felt less secure. Those who could afford it retreated into “fortified enclaves” and private security, and human rights were denounced as “privileges for bandits” (pp. 110–11). Ester waits out a gun battle between police and traffickers while taking her children to school (p. 3).</p></div>
<div style="background:#0E4D63; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px; color:#3DD6C8">Blocked routes up</div><p style="margin:0; font-size:17px">Rio's free public universities generally require private-school preparation to pass the entrance exam, so Ester is shut out even with a diploma (p. 45). “When access to education is limited, the body—relative to the mind—becomes a more important basis for identity as well as a source of power” (p. 252).</p></div>
</div>

</section>

<div style="background:#FFFFFF; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:8px; border:2px solid #F7C6D9"><div class="ui" style="font-weight:800; font-size:21px; color:#C8175D">Beauty as daily work</div><p style="margin:0; font-size:17px">When Preta Gil posed for her first CD cover at 68 kilos, the problem “was not with her nudity but with her weight”: “How can a fatty pose naked?” (p. 38). Vanity is seen as self-care: “To be vain is to feel good… Always <em>cheirosa</em> [fragrant]” (p. 197). For hair, “the straighter (and often the blonder) the better” (p. 143).</p></div>
<div style="background:#FFFFFF; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:8px; border:2px solid #F7C6D9"><div class="ui" style="font-weight:800; font-size:21px; color:#6A2BC2"><em>Siliconadas</em> and Miss <em>Siliconada</em></div><p style="margin:0; font-size:17px">Carla Perez, the “<em>Bunda Nacional</em>”, got 220 ml implants for the 1999 Carnaval, raising the question whether breasts were the “new national preference” (p. 42). In 2001 Miss Brasil winner Juliana Borges was dubbed “Miss <em>Siliconada</em>” after announcing nineteen surgical interventions (p. 72).</p></div>
<div style="background:#FFFFFF; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:8px; border:2px solid #F7C6D9"><div class="ui" style="font-weight:800; font-size:21px; color:#00776F">“More perfect”</div><p style="margin:0; font-size:17px">Dr Lívia sees young women with “marvelous waists and breasts” who “still want to have surgery to become even more perfect” (p. 222). Edmonds argues this is competitive, not just about looking “normal” (pp. 221–23). Men make up 30% of operations and are the fastest-growing group (p. 231).</p></div>

<section id="ch-money" style="scroll-margin-top:72px; background:#0E2438; padding:96px 0">
<div style="max-width:1200px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:40px">

<div class="ui" style="font-size:15px; letter-spacing:0.12em; text-transform:uppercase; font-weight:800; color:#2BD17E">5 · Economic inequality</div>
<h2 class="ui" style="margin:0; font-size:clamp(38px, 5.8vw, 76px); line-height:1; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF">Who can afford to be beautiful?</h2>
<p style="margin:0; font-size:21px; color:#D5DCE4">“Brazil's <em>favelas</em> have become icons of savage capitalism” (p. 16). In 1996 the World Bank ranked Brazil first in the world in income disparity (p. 110). Yet <em>plástica</em> spread down the social ladder as financing plans made it “accessible to the middle and lower middle class” (p. 15). Climb down the ladder, from Ipanema to the <em>favela</em>, and see what beauty costs at each step.</p>
</div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap:16px">
<div style="background:#4FA3FF; color:#04172E; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">US$83→37</div><div class="ui" style="font-size:16px; font-weight:600">Per-capita federal health spending, 1989 to 1993, despite the 1988 Constitution's “universal right to healthcare” (p. 85)</div></div>
<div style="background:#FF7A3D; color:#1F0A00; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">½</div><div class="ui" style="font-size:16px; font-weight:600">The income of nonwhites remained about half that of whites from 1995 to 2001 (p. 154)</div></div>
<div style="background:#B79BFF; color:#160A33; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">44%</div><div class="ui" style="font-size:16px; font-weight:600">of women in São Paulo spend more than a fifth of their salaries on “beauty”, and the poorest proportionally more (p. 107)</div></div>
</div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap:16px">
<div style="background:#2BD17E; color:#03200F; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">0.518</div><div class="ui" style="font-size:16px; font-weight:600">Brazil's Gini index in 2023: its lowest since 2012, but still among the world's most unequal (0 means perfect equality)</div></div>
<div style="background:#FFC531; color:#1A1300; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">58.9m</div><div class="ui" style="font-size:16px; font-weight:600">Brazilians lived in poverty in 2023, 27.4% of the population</div></div>
<div style="background:#FF4F8B; color:#1A0A12; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:6px"><div class="ui" style="font-size:48px; line-height:1; font-weight:800">9.5m</div><div class="ui" style="font-size:16px; font-weight:600">lived in extreme poverty, 4.4% (IBGE, 2023)</div></div>

<p style="flex:1 1 280px; min-width:0; margin:0; color:#D5DCE4">Edmonds (p. 113). When citizenship is defined through consumption, “rights can be resignified as the ability to acquire prestige items, while the antidote to social exclusion is imagined as market participation” (pp. 112–13). As Vera, a public hospital patient, put it: “I deserve this, it's my time now… I have the total right to do it” (p. 85).</p>

<section id="ch-colour" style="scroll-margin-top:72px; background:#FFF6E6; color:#14213D; padding:96px 0">
<div style="max-width:1200px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:40px">

<div class="ui" style="font-size:15px; letter-spacing:0.12em; text-transform:uppercase; font-weight:800; color:#6A2BC2">6 · Racial inequality</div>
<h2 class="ui" style="margin:0; font-size:clamp(38px, 5.8vw, 76px); line-height:1; font-weight:800; letter-spacing:-0.025em">Is beauty colour-blind?</h2>
<p style="margin:0; font-size:21px; color:#3D4660">“Unlike in many parts of the world where lightness of skin tone is fetishized, in Brazil brown is beautiful. On the other hand, blackness is stigmatized, and European facial features and hair confer social advantages” (p. 26). Over 130 colour terms have been identified in everyday speech (p. 132), and a proverb says “money lightens” (p. 132).</p>
</div>

</figure>
<figure style="flex:1 1 440px; min-width:0; margin:0; background:#FFFFFF; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:14px; border:2px solid #EADFCB">

<button class="ui" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}"><sc-for list="{{t.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button>

<div class="ui" style="display:flex; justify-content:space-between; font-size:16px; font-weight:700"><span><sc-for list="{{b.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span><span><sc-for list="{{b.valueText_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span></div>
<div style="height:22px; background:#F1EADC; border-radius:4px; overflow:hidden"><div title="{{b.title}}" style="{{b.style}}"></div></div>
</div>
</sc-for>
</div>
<div class="ui" style="font-size:13px; color:#55534E">Source: IBGE, <em>Síntese de Indicadores Sociais</em> (2024). <em>Pardo</em> and <em>preto</em> Brazilians are roughly twice as likely as white Brazilians to be poor. Compare Edmonds: nonwhite income stayed at about half of white income from 1995 to 2001 (p. 154).</div>
</figure>
</div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:18px">
<div style="background:#6A2BC2; color:#FFFFFF; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px"><em>Boa aparência</em></div><p style="margin:0; font-size:17px">The <em>boa aparência</em> stipulated in some job announcements is “a euphemism for ‘white or comparative lightness’” (p. 109). Luiza: “to participate in a training course, or job competition, you have to be <em>branquinha</em> [whitish]” (p. 109). Zé, a black patient, blamed his “ugly, wide nose” for being turned down as a bus fare collector (p. 109).</p></div>
<div style="background:#C8175D; color:#FFFFFF; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px">“Correction of the Negroid nose”</div><p style="margin:0; font-size:17px">On Nanci's medical form, under “Pre-operative diagnosis”, a resident writes “Negroid nose”: “the ‘racial trait’ itself is the illness” (p. 144). A surgeon says patients don't want “a nose with a foot in Africa, but with a foot in Europe” (p. 147). Whitening has been transformed “into a private practice aiming at happiness and self-improvement” (p. 148).</p></div>
<div style="background:#00776F; color:#FFFFFF; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px">Body versus face</div><p style="margin:0; font-size:17px">There is “almost a schizophrenic split between body and visage” (p. 142). The body is figured as mixed or simply Brazilian, while facial features and hair mark whiteness. One informant ranks it: “hair, nose, and mouth… and skin color afterward” (p. 142). Luisa felt hair implants moved her “from being <em>preta</em> to <em>mulata</em>” (p. 143).</p></div>
<div style="background:#B83A0E; color:#FFFFFF; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:8px"><div class="ui" style="font-weight:800; font-size:21px">“My black is my brand”</div><p style="margin:0; font-size:17px">Jéssica stopped straightening her hair after she “discovered she was <em>negra</em> at age twenty-five”: “My black is my characteristic; it's become my brand” (p. 151). Marketers discovered a niche of “36 million black and <em>mulato</em>” consumers (p. 153), and governments introduced university quotas of up to 40% (p. 152).</p></div>
</div>
</div>
</section>

<section id="ch-argument" style="scroll-margin-top:72px; background:#FFF0F5; color:#14213D; padding:96px 0">
<div style="max-width:1200px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:32px">
<div style="display:flex; flex-direction:column; gap:14px; max-width:880px">
<div class="ui" style="font-size:15px; letter-spacing:0.12em; text-transform:uppercase; font-weight:800; color:#C8175D">10 · Argument</div>
<h2 class="ui" style="margin:0; font-size:clamp(38px, 5.8vw, 76px); line-height:1; font-weight:800; letter-spacing:-0.025em">So why the demand?</h2>
<p style="margin:0; font-size:21px; color:#3D4660">Edmonds thinks there is no single explanation. Start with the argument he pushes against.</p>
</div>
<div style="display:flex; flex-wrap:wrap; gap:20px">
<div style="flex:1 1 340px; min-width:0; background:#FFFFFF; border-radius:24px; padding:30px; display:flex; flex-direction:column; gap:12px; border:2px solid #F7C6D9">
<div class="ui" style="font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:#55534E">The dominant argument</div>
<p style="margin:0">Feminist theories argue that “beauty practices function as a means for the social control of the female body.” Naomi Wolf calls the beauty myth “the last best belief system that keeps male dominance intact” (pp. 29–30). Beauty industries also “raise the specter of cultural imperialism” (p. 25), and surgery on facial features can look like a continuation of whitening (p. 148).</p>
</div>
<div style="flex:1 1 340px; min-width:0; background:#14213D; color:#FFFFFF; border-radius:24px; padding:30px; display:flex; flex-direction:column; gap:12px">
<div class="ui" style="font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:#FF7AA8">Edmonds' position</div>
<p style="margin:0">“The domain of beauty is certainly unequal… Yet, beauty culture does not only subject women to dominant norms; it also reflects and shapes a particular kind of modern subject with diverse aspirations for self-transformation, social mobility, and sexual pleasure and power” (p. 30). As an outsider he tries to “balance critique of the structures producing the culture of beauty with a retrieval of local meanings and values” (p. 234).</p>
</div>
</div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap:16px">
<sc-for list="{{explanations}}" as="x" hint-placeholder-count="6">
<div style="{{x.style}}">
<div class="ui" style="font-size:44px; line-height:1; font-weight:800"><sc-for list="{{x.n_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
<div class="ui" style="font-weight:800; font-size:21px; line-height:1.2"><sc-for list="{{x.title_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
<p style="margin:0; font-size:17px"><sc-for list="{{x.text_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></p>
</div>
</sc-for>
</div>
<div style="background:#FFFFFF; border-radius:24px; padding:30px; display:flex; flex-direction:column; gap:18px; border:2px solid #F7C6D9">
<h3 class="ui" style="margin:0; font-size:30px; font-weight:800">Read it two ways</h3>
<p style="margin:0; color:#3D4660">Choose a case, then switch between the two readings. Edmonds tries to “balance critique of the structures producing the culture of beauty with a retrieval of local meanings and values” (p. 234). Your essays should too.</p>
<div style="display:flex; flex-wrap:wrap; gap:10px">
<sc-for list="{{cases}}" as="c" hint-placeholder-count="4">
<button class="ui" type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}"><sc-for list="{{c.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button>
</sc-for>
</div>
<p style="margin:0; font-size:19px"><sc-for list="{{readCase.situation_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></p>
<div style="display:flex; flex-wrap:wrap; gap:10px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button class="ui" type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.style}}"><sc-for list="{{m.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button>
</sc-for>
</div>
<div style="{{readStyle}}"><div class="ui" style="font-weight:800; font-size:17px"><sc-for list="{{readHeading_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div><div><sc-for list="{{readText_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div></div>
</div>
<div style="background:#C8175D; color:#FFFFFF; border-radius:24px; padding:30px; display:flex; flex-direction:column; gap:12px">
<div class="ui" style="font-weight:800; font-size:26px">Holding both sides</div>
<p style="margin:0">“Beauty certainly is ideology, but it is not (only) false” (p. 173). For some on the margins of the market economy, “physical allure can be an asset that actually seems to disrupt the class hierarchies that pervade many other aspects of their lives. Though this belief also testifies to relative powerlessness, it cannot be simply dismissed as false consciousness” (p. 250). Yet beauty “mirrors the ambiguous emancipatory power of capital itself: it challenges traditional hierarchies, yet exposes the ‘liberated’ body to the new hazards of generalized exchange” (pp. 249–50). And public hospitals' poor patients double as training material for surgeons (pp. 92–101).</p>
</div>

<ol style="margin:0; padding-left:22px; display:flex; flex-direction:column; gap:8px; color:#E4E9EF">

<div><button class="ui" type="button" aria-expanded="{{modelExpanded}}" onClick="{{toggleModel}}" style="min-height:44px; padding:10px 20px; border-radius:999px; border:none; background:#FF4F8B; color:#1A0A12; font-weight:800; font-size:15px"><sc-for list="{{modelLabel_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button></div>
<sc-if value="{{modelOpen}}" hint-placeholder-val="{{ false }}">
<p style="margin:0; padding:22px; background:#FFFFFF; color:#14213D; border-radius:14px">A theory we can use to interpret the rise of <em>plástica</em> among poor women in Rio is Marxist theory, specifically the concept of commodification. Marx argued that capitalism turns things, and eventually people's labour, into goods valued for exchange, masking their human origins as commodity “fetishes” (p. 59). This draws our attention to how the body itself becomes something to invest in. Aline, a 24-year-old promotions worker, wants implants because “we're selected by the body and appearance… I'll have a return on that” (p. 107), and attractive workers earn more “across all occupations” (p. 108). One credit plan even “targets a clientele made up of secretaries, office assistants, and maids” (pp. 108–9). While commodification helpfully explains why beauty works as capital in a service economy, it risks treating patients as falsely conscious. It cannot fully explain the meaning Ester gives her “necessary vanity” (p. 46), the national pride in the mixed body, or Edmonds' point that beauty “cannot be simply dismissed as false consciousness” (p. 250).</p>

<script>
// Minimal standalone renderer for the study site template.
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) { Object.assign(this.state, patch); scheduleRender(); }
  }
  window.DCLogic = DCLogic;

  let comp = null, tpl = null, root = null, pending = false;

  function resolve(path, scope, vals) {
    path = path.trim();
    const parts = path.split('.');
    let cur;
    for (let i = scope.length - 1; i >= 0; i--) { if (Object.prototype.hasOwnProperty.call(scope[i], parts[0])) { cur = scope[i][parts[0]]; break; } }
    if (cur === undefined) cur = vals[parts[0]];
    for (let i = 1; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
    return cur;
  }
  const HOLE = /\{\{([^}]+)\}\}/g;
  function interp(str, scope, vals) {
    return str.replace(HOLE, (m, p) => { const v = resolve(p, scope, vals); return v == null ? '' : String(v); });
  }

  function build(node, scope, vals, out) {
    if (node.nodeType === 3) {
      const t = node.nodeValue;
      out.push(document.createTextNode(t.indexOf('{{') >= 0 ? interp(t, scope, vals) : t));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(node.getAttribute('list') || '');
      const list = m ? resolve(m[1], scope, vals) : null;
      const as = node.getAttribute('as');
      if (Array.isArray(list)) list.forEach((item) => { const s = scope.concat([{ [as]: item }]); node.childNodes.forEach((c) => build(c, s, vals, out)); });
      return;
    }
    if (tag === 'sc-if') {
      const m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(node.getAttribute('value') || '');
      if (m && resolve(m[1], scope, vals)) node.childNodes.forEach((c) => build(c, scope, vals, out));
      return;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.tagName)
      : document.createElement(tag);
    for (const a of Array.from(node.attributes)) {
      const v = a.value;
      if (a.name.toLowerCase() === 'onclick') {
        const m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(v);
        el.__onclick = m ? resolve(m[1], scope, vals) : null;
        continue;
      }
      if (a.name.indexOf('hint-') === 0) continue;
      el.setAttribute(a.name, v.indexOf('{{') >= 0 ? interp(v, scope, vals) : v);
    }
    const kids = [];
    node.childNodes.forEach((c) => build(c, scope, vals, kids));
    kids.forEach((k) => el.appendChild(k));
    out.push(el);
  }

  // Patch the live DOM to match a freshly built tree, by position.
  function morph(live, next) {
    if (live.nodeType === 3) { if (live.nodeValue !== next.nodeValue) live.nodeValue = next.nodeValue; return; }
    const la = live.attributes, na = next.attributes;
    for (let i = la.length - 1; i >= 0; i--) { const n = la[i].name; if (!next.hasAttribute(n)) live.removeAttribute(n); }
    for (let i = 0; i < na.length; i++) { const n = na[i].name, v = na[i].value; if (live.getAttribute(n) !== v) live.setAttribute(n, v); }
    live.__onclick = next.__onclick;
    morphChildren(live, next);
  }
  function same(a, b) { return a.nodeType === b.nodeType && (a.nodeType === 3 || a.nodeName === b.nodeName); }
  function morphChildren(live, next) {
    const lk = Array.from(live.childNodes), nk = Array.from(next.childNodes);
    for (let i = 0; i < nk.length; i++) {
      const l = lk[i], n = nk[i];
      if (!l) live.appendChild(n);
      else if (same(l, n)) morph(l, n);
      else live.replaceChild(n, l);
    }
    for (let i = nk.length; i < lk.length; i++) live.removeChild(lk[i]);
  }

  function render() {
    pending = false;
    const vals = comp.renderVals();
    const out = [];
    tpl.content.childNodes.forEach((c) => build(c, [], vals, out));
    const holder = document.createElement('div');
    out.forEach((n) => holder.appendChild(n));
    if (!root.firstChild) { while (holder.firstChild) root.appendChild(holder.firstChild); }
    else morphChildren(root, holder);
  }
  function scheduleRender() { if (!comp || pending) return; pending = true; requestAnimationFrame(render); }

  document.addEventListener('click', (e) => {
    let t = e.target;
    while (t && t !== document) { if (typeof t.__onclick === 'function') { t.__onclick(e); return; } t = t.parentNode; }
  });

  window.__mount = function (Component) {
    tpl = document.getElementById('tpl');
    root = document.getElementById('app');
    comp = new Component({});
    pending = true; render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

}

componentDidMount() {
this._onScroll = () => {
if (this._raf) return;
this._raf = requestAnimationFrame(() => {
this._raf = null;
const doc = document.documentElement;
const max = (doc.scrollHeight || 0) - (window.innerHeight || 0);
const y = window.scrollY || doc.scrollTop || 0;
const p = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;
let active = 'puzzle';
const ids = this.data().nav.map((n) => n[0]);
for (let i = 0; i < ids.length; i++) {
const el = document.getElementById('ch-' + ids[i]);
if (el && el.getBoundingClientRect().top < 160) active = ids[i];
}
if (Math.abs(p - this.state.prog) > 0.003 || active !== this.state.active) this.setState({ prog: p, active: active });
});
};
window.addEventListener('scroll', this._onScroll, { passive: true });
this._onScroll();
}

componentWillUnmount() {
if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
}

{ id: 'pitanguy', name: 'Dr Ivo Pitanguy', tag: 'The “philosopher of plástica”', source: 'pp. 14–15, 47–57, 82', facts: ['Born in Minas Gerais in 1926. Trained in the US, France and England with Archibald McIndoe and Sir Harold Gillies (p. 51).', 'Founded the Santa Casa ward in 1962. Among the first patients were hundreds of children burned in a circus fire (p. 14).', 'Trained over 500 surgeons. Has over 800 publications and a place in Brazil’s Academy of Letters (p. 14).', 'The surgeon is “a psychologist with a scalpel in his hand” (p. 14). He warns of the “Pygmalion Complex” (p. 82).', 'Called the Carnaval parade the most meaningful recognition of his work (p. 50).'], quote: '“Plastic surgery is not only for the rich. The poor have the right to be beautiful.” (p. 14)', concepts: ['power', 'belief and knowledge', 'symbolism'], question: 'What does it mean to “democratize” plastic surgery? Who benefits?' },
{ id: 'preta', name: 'Preta Gil', tag: 'Singer and media personality', source: 'pp. 37–41, 123–27', facts: ['Daughter of pop star and minister of culture Gilberto Gil. Her name means “black” (pp. 37–38).', 'Posed naked on her first CD cover at 68 kilos: “How can a fatty pose naked?” (p. 38).', 'Had implants and a tummy tuck after having a baby and breastfeeding, plus three liposuctions (p. 39).', 'Converted to evangelical Christianity and goes to church in make-up, once in a bikini (p. 40).', 'Identifies as negra: “Just look at my nose!” (p. 125).'], quote: '“She is a woman; she has the right. But it’s expensive, and you have to know where to do it.” (on her manicurist, p. 39)', concepts: ['identity', 'symbolism', 'culture'], question: 'How does Preta show both pride in plástica and ambivalence about it (pp. 40–41)?' },
{ id: 'ludmila', name: 'Ludmila', tag: '17, waiting three years at Santa Casa', source: 'pp. 102–3, 118', facts: ['Seventeen. Seeks a breast reduction and lift, examined at the Friday “surgical plan” in front of residents (p. 102).', 'Her mother: “Her auto-estima [self-esteem] is low” (p. 102).', 'The residents split over whether she should have surgery. Dr Afonso signs her file (p. 103).'], quote: '“Wait? I’ve been waiting on line for three years.” Ludmila. And Dr Afonso: “Her principal illness is poverty.” (pp. 102–3)', concepts: ['power', 'society', 'belief and knowledge'], question: 'Edmonds calls the defect “sociosomatic” (p. 104). What does Ludmila’s case show?' },
{ id: 'aline', name: 'Aline', tag: '24, promotions worker, North Zone', source: 'pp. 106–8', facts: ['A twenty-four-year-old implant candidate who reads Plástica & Beleza (p. 106).', 'A cheap North Zone clinic offered R$3,000 in up to eleven payments, still a large “sacrifice”, so she tried Santa Casa (p. 107).', 'Hands out Gatorade at promotions for at least fifty reais a day, irregular with no benefits. Saving to study marketing (p. 107).'], quote: '“It’s something for my work because they really demand a good appearance. I pass through a selection for each job I get, and the better I am… I’ll have a return on that.” (p. 107)', concepts: ['materiality', 'power', 'society'], question: 'Is Aline a victim of beauty norms, or a strategic actor reading the labour market accurately? Can she be both?' },
{ id: 'nanci', name: 'Nanci', tag: '58, rhinoplasty patient', source: 'pp. 143–44', facts: ['Fifty-eight, a former cook, divorced with a new “companion”. Operated on at Servidores do Estado public hospital (p. 143).', 'The anaesthetist curses that it is “a black woman with a Negroid nose” without an “indication” (p. 144).', 'A resident writes “Negroid nose” as the pre-operative diagnosis (p. 144).'], quote: '“It’s ugly, very flat. I want to refine it, turn it up.” (p. 143)', concepts: ['identity', 'power', 'symbolism'], question: 'Is Nanci’s surgery whitening, or “beautifying”? How does Edmonds compare Brazil and the US (pp. 145–46)?' },
{ id: 'firmina', name: 'Dona Firmina', tag: '58, beach snack seller', source: 'pp. 5, 47–49', facts: ['A fifty-eight-year-old widow who runs a snack stand at Praia da Urca with her companion Gilson (p. 47).', 'Left a family of subsistence farmers in Minas Gerais because there “wasn’t enough food”, and worked as a live-in maid (p. 47).', 'Saved about R$1,300 over three years for a facelift at Santa Casa. Before that she had been to hospital only once, to give birth. Functionally illiterate (p. 47).', 'Gilson was 78% burned in an explosion. His reconstructive surgery contrasts with her cosmetic facelift (p. 48).'], quote: '“My face was awful because I was in the sun so much.” … “I thought I would be rejuvenated, just like the artistas.” (p. 47)', concepts: ['power', 'social relations', 'society'], question: 'How do Firmina and Gilson show the blurred line between estética and reparadora (pp. 48–49)?' },
{ id: 'flavia', name: 'Flávia and Bete', tag: 'Telemarketer and her mother', source: 'pp. 52–54, 139, 225–26, 237', facts: ['Flávia: twenty-five, divorced, a telemarketer in Méier, living with her five-year-old daughter and her mother Bete (p. 52).', 'Pitanguy operated on her at a steep discount. She calls his clinic the “Mercedes” of plástica (p. 53).', 'Earlier, an aesthetician injected liquid silicone into her buttocks to “better fit the Brazilian padrão” (p. 139).', 'Bete had plástica too. Flávia: “Mom is a snapshot of me in the future” (pp. 225–26).'], quote: '“I am a slave of beauty. I like myself; I love myself.” (p. 237)', concepts: ['culture', 'change', 'materiality'], question: 'How do mother and daughter become “equal sexual beings” in competition (p. 226)?' },
{ id: 'joana', name: 'Joana and Cecília', tag: 'Edmonds’ girlfriend and her mother', source: 'pp. 178–82, 188–89', facts: ['Edmonds dated Joana, a theatre student. Her mother Cecília, separated from her husband, had plástica (p. 178).', 'He met Cecília “through one of the fictive-kin relations that fieldworkers have often found to be the only means of assimilation into a different society” (p. 179).', 'In her late thirties Cecília had abdominal surgery and liposuction to “correct” three Caesarean births (p. 181).'], quote: '“Don’t worry about him, anthropology is the science of gossip.” Joana (p. 179)', concepts: ['social relations', 'belief and knowledge'], question: 'Does a personal relationship give better insight, or compromise objectivity?' },
{ id: 'amelia', name: 'Amélia', tag: 'Aspiring model, former passista', source: 'pp. 205–8', facts: ['Learned about modelling through a course for girls in “needy communities” (p. 206).', 'Works as a receptionist and saves for a portfolio costing up to R$1,000. Dreams of liposuction (p. 206).', 'Used to parade as a passista. Now: “Carnaval is a business” (p. 207).', 'Ignored in an Ipanema shop “as if I wasn’t there” (p. 207).'], quote: '“I want to do some good jobs so that people see me and say ‘Ah, Amélia did that!’ I want to be recognized.” (p. 206)', concepts: ['identity', 'commodification', 'power'], question: 'Why might the dream of modelling be “a definitive negation of a particular kind of social invisibility” (pp. 207–8)?' }
];
d.explanations = [
['1', 'Beauty as mobility', 'Attractiveness is an “imaginary vehicle of ascent for those blocked from more formal routes of social mobility” (p. 20). Service workers see appearance as a job asset (pp. 106–9).', '#FFC531', '#1A1300'],
['2', 'The right to beauty', 'Pitanguy proclaimed that “the poor have the right to be beautiful” (p. 14), and public hospitals offer cosmetic surgery. “The residents need to practice” (p. 92).', '#FF4F8B', '#1A0A12'],
['3', 'Self-esteem', 'Surgeons define cosmetic surgery as treating mental suffering (p. 21): “faced with an aesthetic defect, don’t the poor suffer as much as the rich?” (p. 56).', '#3DD6C8', '#04201D'],
['4', 'Sexuality and reproduction', 'Plástica is linked to “a larger field that ‘manages’ female reproduction and sexuality”, such as Caesareans and sterilisations (pp. 32, 183–89).', '#B79BFF', '#160A33'],
['5', 'More than whitening', '“In Brazil brown is beautiful”, yet “blackness is stigmatized, and European facial features and hair confer social advantages” (p. 26).', '#FF7A3D', '#1F0A00'],
['6', 'Media, consumption and credit', 'Globo’s “glamour and modernity” (p. 66), celebrity siliconadas, and credit plans that made plástica “accessible to the middle and lower middle class” (p. 15).', '#2BD17E', '#03200F']
];
d.cases = {
aline: { label: 'Aline’s implants', situation: 'Aline, 24, does product promotions and believes implants will help her get selected for work (p. 107).', suspicion: 'Service work turns the worker into “part of the product” (p. 108), and boa aparência works as a colour bar (p. 109). Credit plans target low-paid workers (pp. 108–9). Social anxieties are turned into an aesthetic “defect” to be fixed (p. 114).', retrieval: 'Aline reads her world accurately. In service work appearance can “add value”, and attractive people earn more (p. 108). She wants to “improve myself” and says surgery “will boost my self-esteem” (p. 107).' },
ester: { label: 'Ester’s “necessary vanity”', situation: 'Ester, a cook from Vidigal, saves part of her minimum wage for implants at Santa Casa (p. 44).', suspicion: 'Ester faces exclusion everywhere: in education, on the labour market without connections or boa aparência, and in security (p. 45). Surgery offers a personal fix for structural problems.', retrieval: 'Ester “stresses the psychological basis of her complaint”: “to start another relationship you think, will someone like me, accept my defects?” Her surgery is “a necessary vanity” (p. 46), not emulation of the rich.' },
ludmila: { label: 'Ludmila at Santa Casa', situation: 'Ludmila, 17, has waited three years for a breast reduction and is examined before residents (p. 102).', suspicion: 'The teaching hospital exposes poor bodies (p. 86). Plástica “locates suffering in an ego that is diagnosed and treated in separation from the larger political and social field” (p. 103). Even her surgeon says: “Her principal illness is poverty.”', retrieval: 'For Ludmila and her mother, the operation is a long-awaited right. She “experienced her suffering as a deficit in self-esteem that could be surgically corrected” (p. 118).' },
nanci: { label: 'Nanci’s nose', situation: 'Nanci, 58, has a “correction of the Negroid nose” at a public hospital (pp. 143–44).', suspicion: 'The medical form makes “the ‘racial trait’ itself… the illness” (p. 144). Whitening survives, “transformed… into a private practice aiming at happiness and self-improvement” (p. 148).', retrieval: 'In Brazil’s fluid colour system, such surgeries may be chosen “precisely because they do not correct racial features, but simply ‘beautify’” (p. 146). Patients aren’t trying to “pass” as white (p. 147).' }
};
d.concepts = [
{ id: 'belief', name: 'Belief and knowledge', def: 'The systems of ideas and expertise people use to understand the world, and whose knowledge counts as true.', inPM: [['Pitanguy’s humanistic vision: the surgeon as “a psychologist with a scalpel in his hand”.', 'pp. 14, 52'], ['Self-esteem gives cosmetic surgery its “illness”: “it was the illness, not the cure, which awaited discovery”.', 'pp. 75–78'], ['Dr Claudio’s argument from the WHO definition of health: “You have to reach health through happiness.”', 'p. 55'], ['Freyre’s celebration of mestiçagem shapes a national “beauty myth”.', 'pp. 129–34']], apply: ['Whose expertise defines a “defect”: surgeons, patients, media?', 'How does medical language make a belief about beauty look like fact?', 'Which beliefs compete, for example Pitanguy’s “anthropological” relativism (p. 114)?'], nuance: '“The defect only becomes ‘operable’ when the patient herself sees it, and feels it enough” (p. 99). Patients also scoff at or reject the therapeutic rationale (Janaína, p. 221).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of belief and knowledge.', plan: ['Define the concept and link it to medicalisation.', 'Example: Pitanguy and self-esteem (pp. 14, 75–89).', 'Example: the WHO argument for public funding (p. 55).', 'Evaluate: patients’ own knowledge and desires (pp. 99–100).'] },
{ id: 'change', name: 'Change', def: 'How cultural and social elements alter over time, and what stays the same.', inPM: [['Plastic surgery techniques were perfected on war wounds, then used for cosmetic surgery.', 'pp. 78, 219'], ['Operations rose sixfold in the 1990s as credit spread.', 'pp. 15–16'], ['Ideals shift: the 1999 “Carnaval of siliconadas”, with implant sizes almost doubling.', 'pp. 41–44'], ['Average patient age fell from 55 (1980) to 35 (2000). The patriarchal family declined.', 'pp. 222–24']], apply: ['What changed, when, and why?', 'Who benefits, and who is left out?', 'What stayed the same?'], nuance: '“The whitening ideal never went away; instead, it mingled informally with mestiçagem” (p. 173).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of change.', plan: ['Define change at several scales.', 'Example: the democratisation of plástica (pp. 14–16).', 'Example: shifting ideals and patient ages (pp. 41–44, 222).', 'Evaluate with continuity (p. 173).'] },
{ id: 'culture', name: 'Culture', def: 'The shared, learned meanings and practices through which a group makes sense of the world.', inPM: [['The national “preference” for the bunda.', 'pp. 135–39'], ['Beach-going “has generated its own specific habitus”.', 'p. 133'], ['Vaidade (vanity) understood as self-care.', 'p. 197'], ['A global medical specialty that “incites” a national cultural logic of beauty.', 'p. 148']], apply: ['What is taken for granted about the body in Rio?', 'How does a global practice gain local meaning?', 'Who defines “Brazilian” culture?'], nuance: 'Black movements reject colour terms and mestiçagem, and the “national” ideal is contested (pp. 126–27, 151–52).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of culture.', plan: ['Define culture.', 'Example: the national passion (pp. 135–39).', 'Example: vanity as self-care (p. 197).', 'Evaluate: contested ideals (pp. 150–52).'] },
{ id: 'identity', name: 'Identity', def: 'How individuals see themselves and how others see and categorise them.', inPM: [['Interest in plástica “cuts across subcultures, identities, and professions”.', 'p. 38'], ['Preta Gil: “I am negra, because I have black blood.”', 'pp. 125–27'], ['Jéssica: “My black is my characteristic; it’s become my brand.”', 'p. 151'], ['Patients “were not trying to change their identity, but restore it”.', 'p. 190']], apply: ['Is identity chosen, ascribed or bought?', 'How does the body make identity visible?', 'How do gender, colour and class intersect?'], nuance: 'Phenotype often “counts for more than origin” in the folk taxonomy, so identities are contested (p. 126).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of identity.', plan: ['Define identity.', 'Example: Preta and racial identification (pp. 124–27).', 'Example: restoring identity after motherhood (p. 190).', 'Evaluate: structural limits such as boa aparência (p. 109).'] },
{ id: 'materiality', name: 'Materiality', def: 'How objects, substances and physical things carry social meaning.', inPM: [['Ester’s implant: a midcost R$1,500 model, natural shape.', 'p. 2'], ['Liquid silicone, “an industrial oil”, against medical implants.', 'pp. 98, 139'], ['Plástica & Beleza, before-and-after photos, and a patient’s picture of Sharon Stone.', 'pp. 61, 67–68'], ['Bodies “visualized, treated, and priced in parts”.', 'p. 68']], apply: ['Which objects mediate patient and surgeon?', 'How does price change meaning?', 'How does the body become an investment?'], nuance: '“Plástica is a lottery… I was one of the rare ones who failed with plástica” (p. 95).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of materiality.', plan: ['Define materiality.', 'Example: implants and silicone (pp. 2, 98).', 'Example: the fragmented, priced body (p. 68).', 'Evaluate: material risks (pp. 94–95).'] },
{ id: 'power', name: 'Power', def: 'The ability of people and institutions to influence others, and how power circulates.', inPM: [['Public hospitals: “The residents need to practice.”', 'pp. 92–93'], ['“A certain amount of misogyny in the medical gaze.”', 'p. 185'], ['Sterilisation certificates and boa aparência.', 'pp. 187, 109'], ['Bourdieu: beauty “threatens the other hierarchies”.', 'p. 250']], apply: ['Who holds power: surgeons, the state, media, employers, men?', 'Is power repressive or productive (Foucault, pp. 116–17)?', 'Where do less powerful people use beauty as a resource?'], nuance: 'Beauty is a “double negative”: an unfair hierarchy that can disturb other unfair hierarchies (p. 250).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of power.', plan: ['Define power with Foucault and Bourdieu.', 'Example: hospital school (pp. 89–101).', 'Example: beauty as capital (pp. 20, 250).', 'Evaluate agency: beauty as a “tactic” (p. 204).'] },
{ id: 'social', name: 'Social relations', def: 'Relationships between people and groups, and the expectations and hierarchies within them.', inPM: [['Ester and Dr Eduardo: “moments of awkwardness”.', 'p. 45'], ['“Domestic work is thus a key site where class and femininity intersect.”', 'p. 201'], ['Flávia and Bete: mother and daughter as competitors.', 'pp. 225–26'], ['Surgeons operate on kin, friends and their own maids.', 'pp. 196–99']], apply: ['Which relationships does surgery change?', 'What hierarchies shape them?', 'How do Edmonds’ own relationships shape his data (p. 179)?'], nuance: '“Familiarity can temporarily dissolve social boundaries, but it can also coexist with ambivalent emotions” (p. 199).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of social relations.', plan: ['Define social relations.', 'Example: maids and employers (pp. 195–204).', 'Example: mothers and daughters (pp. 225–26).', 'Evaluate: intimacy and hierarchy (p. 198).'] },
{ id: 'society', name: 'Society', def: 'The structured whole of institutions, groups and relationships people live in.', inPM: [['Brazil ranked first in income disparity in 1996.', 'p. 110'], ['Two-tier health: “excluding universalism”.', 'p. 85'], ['Citizenship and consumption “became blurred”.', 'pp. 111–13'], ['“Social boundaries… are built into the architecture of the city.”', 'p. 21']], apply: ['Which institutions shape demand?', 'How do class and race organise access?', 'What kind of society makes beauty a right?'], nuance: 'Democracy brought new rights alongside violence: “many Brazilians feel less secure than they did during the dictatorship” (p. 110).', practice: 'Analyse the ethnographic data presented in Pretty Modern using the key concept of society.', plan: ['Define society.', 'Example: two-tier health care (p. 85).', 'Example: consumer citizenship (pp. 111–13).', 'Evaluate: change after dictatorship (pp. 104–6).'] },

d.lenses = [
{ id: 'marxist', name: 'Marxist theory', figures: 'Karl Marx · commodification · false consciousness', core: 'Capitalism turns things, labour and bodies into commodities. Commodities become “fetishes”, masking their origins in human labour (p. 59).', inPM: ['Attractive people earn more “across all occupations” (p. 108). Credit plans target maids (pp. 108–9).', 'Marx “denounced bourgeois marriage for creating speculation in women’s virginity” (p. 31).', 'Beauty “mirrors the ambiguous emancipatory power of capital itself” (pp. 249–50).'], strength: 'Explains beauty as capital and growth amid inequality.', limit: 'Beauty “cannot be simply dismissed as false consciousness” (p. 250).', question: 'Is Aline’s surgery false consciousness or an accurate reading of the market?' },
{ id: 'feminist', name: 'Feminist theories', figures: 'Naomi Wolf · Susan Bordo · Sandra Bartky', core: '“Beauty practices function as a means for the social control of the female body” (pp. 29–30).', inPM: ['Plástica is “uma coisa de mulher” (a woman’s thing) (p. 183).', '“A certain amount of misogyny in the medical gaze” (p. 185).', 'Iris Marion Young: a “patriarchal logic” splits motherhood and sexuality (p. 191).'], strength: 'Shows gender norms inscribed on bodies.', limit: '“Patriarchy is a near universal. How then can we understand variations…?” (p. 30).', question: 'Can plástica be both liberating and oppressive?' },
{ id: 'globalisation', name: 'Globalisation theories', figures: 'Global flows of images, technologies and goods', core: 'Images, technologies and goods cross borders and are reworked locally.', inPM: ['A debate about “large breast imperialism” allegedly launched by California blonds (p. 26).', 'Plastic surgery “takes a localized form” in Brazil (p. 148).', 'Foreign residents train in Brazil, and Brazil is a top destination for medical tourism (pp. 15, 93, 101).'], strength: 'Brazil as receiver and pioneer: “not always dominated by the West” (p. 118).', limit: 'It would be hard to see beauty industries “as simply an effect of Westernization” (p. 25).', question: 'Is the ideal neocolonial, hybrid, or both?' },
{ id: 'symbolic', name: 'Symbolic and interpretive anthropology', figures: 'Clifford Geertz · Mary Douglas', core: 'Culture is a web of meanings. “The body is a microcosm of society” (Douglas, p. 103).', inPM: ['Geertz’s “deep hanging out” (p. 57).', 'Beauty as a “myth”: “stories that are collectively told” (p. 30).'], strength: 'Draws out local meanings, the “retrieval” side of Edmonds’ approach (p. 234).', limit: 'Can underplay material inequality.', question: 'What does a surgically changed body “say” in Rio?' },
{ id: 'practice', name: 'Practice theory', figures: 'Pierre Bourdieu · Michel de Certeau', core: 'People act within structures (habitus, capital) and reproduce or adjust them. Strategies of the strong, tactics of the weak.', inPM: ['Beauty as a “tactic, a move performed by the weak on terrain defined by the strong” (pp. 20, 204).', 'Bourdieu’s exception: beauty is “fatally attractive” (p. 250).', 'Sexual capital, “generally neglected by Bourdieu” (p. 248).'], strength: 'Balances structure and agency, like Edmonds.', limit: 'Can make choices look purely calculated.', question: 'How do women navigate structures using their bodies?' },
{ id: 'postcolonial', name: 'Postcolonial theory', figures: 'Frantz Fanon · Edward Said · Talal Asad', core: 'Colonial hierarchies live on in minds and tastes. (Lens from class materials. Edmonds does not cite these thinkers.)', inPM: ['The “correction of the Negroid nose” (p. 144).', 'Colonial letters fascinated by “the beauty and innocence of the local women” (p. 62). A “tropicalist fantasy of foreigners” (p. 24).', 'Freyre “is clearly replicating the colonial gaze on the female body” (p. 133).'], strength: 'Explains which features are “corrected”.', limit: 'Brazil’s hybrid ideal resists a simple whitening story (p. 146).', question: 'Which Paper 1 passage suits postcolonial theory?' },
{ id: 'foucault', name: 'Poststructuralist theory', figures: 'Michel Foucault', core: 'Power circulates through institutions and expertise, and produces subjects: biopower, normalisation, medicalisation.', inPM: ['Plástica “participates in this normalizing function of medicine” (p. 116).', 'But it is “an intensely ‘private mode of subjectivation’”, not state biopolitics (p. 117).', 'Edmonds critiques Foucauldian approaches for missing local meanings (pp. 234–35).'], strength: 'Explains why surgery feels like a free choice yet is shared by so many.', limit: 'Notions of biopower “can overstate the power of medicine” (p. 117).', question: 'Can a choice be both free and disciplined?' },

d.ethics = [
{ id: 'consent', name: 'Informed consent', def: 'Participants should understand the research and freely agree to take part. Consent is ongoing, and an overt role, being open about who you are, is the norm.', pm: ['He got permission from the ward director before shadowing Dr Eduardo at Santa Casa (p. 10).', 'When a patient mistakes him for a resident and hands him her files: “I explain my research” (p. 11).', 'Ester knows he is “writing a story” about her operation (p. 4).', 'At the “surgical plan”, patients disrobe “in front of a room filled with residents and medical visitors” (p. 86).'], critical: 'In hospitals, access comes through surgeons. Could patients exposed in front of a lecture room really refuse an extra observer? Consent is shaped by power and by hope of getting surgery.' },
{ id: 'anonymity', name: 'Anonymity and confidentiality', def: 'Protecting participants’ identities and private information, usually with pseudonyms and by disguising details.', pm: ['“Names are mostly pseudonyms.” The exceptions are Ester, who “agreed to be identified by name” and appears in a photograph, celebrities discussing their public persona, and chief surgeons interviewed in that role (p. 257).', 'Dr Rubens was “the only surgeon who requested not to be identified” (p. 93).', 'Edmonds shares intimate details: surgeries, sexuality, family conflict (e.g. Cecília and Léia, pp. 180–81).'], critical: 'Anonymity can be negotiated, not just imposed. Ester chooses visibility, but her friends joke, “You’re going to make Ester famous” (p. 4). Can an anthropologist foresee the risks of naming someone?' },
{ id: 'harm', name: 'Do no harm', def: 'Research must not damage participants’ safety, wellbeing or reputation, with extra care for vulnerable people such as minors.', pm: ['Minors can’t be examined without a guardian present (Ludmila, p. 102).', 'Some public hospital patients were “unaware that operations would leave a scar” (p. 95).', 'A sociologist warned him not to stay in the favela at night (p. 2). By working with one NGO he “unwittingly” took sides over drug traffickers’ role in the community (p. 211).'], critical: 'Is it ever right to observe without intervening? Writing about patients’ complications or “vanity” could also cause harm by making them look foolish.' },

['an irredeemable fault in ethnography: thinness', 'p. 10', 'Without observing practice, Edmonds fears his data is shallow. Access depends on a gatekeeper, a surgeon.', 'Methods'],
['Accustomed to private clinics', 'p. 10', 'He contrasts icy air conditioning and magazines in private clinics with sweltering corridors here. Class inequality shapes the experience of care.', 'Society'],
['rainbow of color terms', 'p. 11', 'Private patients tend to be “whitish”; public patients span the full range of colour. Class and colour overlap.', 'Identity'],
['a pedagogical exercise for the residents', 'p. 11', 'Patients’ bodies are used to train surgeons. This raises questions of consent and power.', 'Power'],
['I am easily mistaken for a resident', 'p. 11', 'He explains his research, but the confusion matters ethically: would patients speak differently to a doctor than to an anthropologist?', 'Ethics'],
['dar um jeitinho', 'p. 12', 'Claudia Regina hopes to “pull strings” to get a senior surgeon. The jeitinho is a Brazilian way of getting round bureaucracy: a tactic of the weak.', 'Belief and knowledge']
],
concepts: ['Power', 'Society', 'Social relations', 'Identity'], method: 'Gaining access through a gatekeeper, participant observation in a hospital, and informal conversations in waiting rooms.',
question: 'Patients have waited months or years for surgery. How free are they to refuse an observer? Link to Paper 1 ethics.' },

{ id: 'ludmila', title: 'Her principal illness is poverty', pages: 'pp. 102–3', where: 'Part One, “The Right to Beauty”', color: '#FFC531', ink: '#1A1300',
summary: 'At the Friday “surgical plan”, patients expose their bodies before rows of residents. Ludmila, 17, sullen and tense, wants a breast reduction. Her mother says she has back pain and low self-esteem. Ludmila protests that she has waited three years. The residents are split, until the professor, Dr Afonso, cuts them short: the real reason to operate is not her back but her shame, and her poverty.',
why: 'This scene drives Edmonds’ argument that the clinic treats individual psychology while suffering has social causes. He then turns to Mary Douglas: the body as a microcosm of society.',
anns: [
['asked to expose the relevant part of the body', 'p. 102', 'The medical gaze examines body parts in public. Compare Foucault on how institutions observe and classify bodies.', 'Power'],
['Her auto-estima [self-esteem] is low', 'p. 102', 'Self-esteem is the language that justifies cosmetic surgery in public hospitals. The mother uses it to argue for her daughter.', 'Belief and knowledge'],
['I’ve been waiting on line for three years', 'p. 102', 'Ludmila asserts herself. Surgery is something she has a right to and has worked for.', 'Identity'],
['Her principal illness is poverty', 'p. 103', 'The turning point: the diagnosis widens from the psyche to society. Even a surgeon sees beauty problems as social problems.', 'Society'],
['the body is a microcosm of society', 'p. 103', 'Edmonds draws on Mary Douglas (symbolic anthropology): politics is “corporeally inscribed”.', 'Symbolism'],
['symptoms of a larger social disorder', 'p. 103', 'His own argument: aesthetic “defects” are signs of competitive labour and sexual markets, not only of a troubled self.', 'Change']
],
concepts: ['Power', 'Society', 'Belief and knowledge', 'Symbolism'], method: 'Observation of a clinical teaching session, then interpretation through theory. A good example of moving from data to argument.',
question: 'Who decides what Ludmila is suffering from: Ludmila, her mother, the residents or the professor? What does this show about power?' },

{ id: 'mixture', title: 'Kinds of mixture', pages: 'p. 12 and p. 141', where: 'Introduction and Part Two, “Beautiful People”', color: '#B79BFF', ink: '#160A33',
summary: 'Surgeons explain that patients with African ancestry form more keloid scars, but complain that in a mixed population they cannot always tell who that is. A senior surgeon then ranks mixtures: the “mulato” is “a very attractive product”, but the Indian has “an ugly body”. Edmonds links these comments to Gilberto Freyre’s celebration of mixture and to prejudice against northeastern migrants.',
why: 'It shows that the national ideal of mixture does not end racial hierarchy. Old colonial ideas survive inside modern medicine and ideas of beauty.',
anns: [
['Because of this miscegenation', 'p. 12', 'A resident uses race to explain a surgical technique. Race enters medical knowledge.', 'Belief and knowledge'],
['The population here is so mixed up', 'p. 141', 'Racial categories are fluid in Brazil. A patient’s tan reveals ancestry the surgeon had not seen.', 'Identity'],
['a very attractive product: the mulato', 'p. 141', 'The language of “product” treats mixture as an aesthetic result. Celebration and commodification of race go together.', 'Materiality'],
['an ugly body which is the northeastern type', 'p. 141', 'Not all mixture is valued. Indigenous and northeastern bodies are ranked below.', 'Power'],
['His comments echo themes in Freyre’s works', 'p. 141', 'Freyre’s myth of a mixed nation shapes how surgeons see bodies. Compare the “racial democracy” debate.', 'Culture'],
['a long colonial discourse', 'p. 141', 'A surgeon traces scars to African ethnic groups, echoing slavery-era hierarchies. A postcolonial reading fits here.', 'Change']
],
concepts: ['Belief and knowledge', 'Identity', 'Power', 'Culture'], method: 'Interviews and informal talk with surgeons, read against Brazilian history and Freyre’s writing.',
question: 'Does celebrating mixture reduce racism, or hide it? Use this passage and the “racial democracy” idea (p. 34).' },

{ id: 'fatal', title: 'Fatally attractive', pages: 'pp. 249–50', where: 'Conclusion', color: '#2BD17E', ink: '#03200F',
summary: 'Edmonds draws his argument together. Beauty culture fragments the body into parts and splits women into roles such as mother, sexual being, maid and wife. Beauty “mirrors the ambiguous emancipatory power of capital”. He returns to a surgeon’s comment that the poor have the right to be beautiful, and uses Bourdieu to argue that beauty can disrupt class hierarchies.',
why: 'This is Edmonds’ final answer to his puzzle. It balances critique of the market with respect for what beauty means to people on the margins.',
anns: [
['The body fragmented into parts', 'p. 249', 'Commodification: the body is valued and improved in pieces, like goods.', 'Materiality'],
['splits the role of woman into mother and sexual being', 'p. 249', 'A feminist point: the marks of motherhood become “defects” to be removed.', 'Identity'],
['the ambiguous emancipatory power of capital itself', 'p. 250', 'Beauty frees and constrains at once. It challenges traditional hierarchies but exposes the body to the market.', 'Change'],
['the poor have the right to be beautiful', 'p. 250', 'The surgeon’s comment that first drew Edmonds to the research. The conclusion returns to the beginning.', 'Power'],
['cannot be simply dismissed as false consciousness', 'p. 250', 'Edmonds rejects a purely Marxist reading. People’s belief in beauty makes sense in their circumstances.', 'Belief and knowledge'],
['an unfair hierarchy that can disturb other unfair hierarchies', 'p. 250', 'His thesis in one line, building on Bourdieu: beauty is a “double negative”.', 'Society']
],
concepts: ['Change', 'Power', 'Society', 'Materiality'], method: 'Synthesis: Edmonds brings fieldwork cases together with theory (Marx, Bourdieu, Baudrillard).',
question: 'Do you agree that beauty can disturb class hierarchies? Test the claim against Ester, Aline or Ludmila.' }
];

if (last < str.length) out.push({ t: str.slice(last), st: '' });
return out;
}

walk(v) {
if (Array.isArray(v)) return v.map((x) => (typeof x === 'string' || typeof x === 'number') ? { t: x, s: this.segs(String(x)) } : this.walk(x));
if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) { const x = v[k]; o[k] = this.walk(x); if (typeof x === 'string' || typeof x === 'number') o[k + '_s'] = this.segs(String(x)); } return o; }
return v;
}
